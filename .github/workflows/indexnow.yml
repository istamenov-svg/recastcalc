name: IndexNow

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update PMMS rates']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    # After a rate update, run only if it succeeded and actually pushed a new commit to main.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Pick the commit to wait for
        id: target
        run: |
          head=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ] && [ "$head" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Rate update made no commit; nothing to submit."
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$head" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.target.outputs.sha != ''
        with:
          node-version: 22

      - name: Wait for deploy and submit to IndexNow
        if: steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/indexnow.mjs

  check-404:
    # Runs once the deploy is confirmed live; unknown URLs must return a real 404, not the homepage.
    needs: submit
    runs-on: ubuntu-latest
    steps:
      - name: Request a missing page
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://recastcalc.com/this-page-does-not-exist?t=$(date +%s)")
          echo "GET /this-page-does-not-exist: HTTP $status"
          if [ "$status" != "404" ]; then
            echo "::error::Expected HTTP 404 for an unknown URL, got $status"
            exit 1
          fi
